<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meridiano 72 — Specialty Coffee</title>

<meta name="description" content="Meridiano 72 — Colombian specialty coffee. Con los pies en la tierra.">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #fff;
}

.hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 650px;
    background-image:
        linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.30)),
        url("V.2.png");
    background-size: cover;
    background-position: center;
}

nav {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 30px 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
}

.logo {
    font-family: Georgia, serif;
    font-size: 27px;
    letter-spacing: 6px;
    white-space: nowrap;
}

.menu {
    display: flex;
    align-items: center;
    gap: 34px;
}

.menu a {
    color: white;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.radio {
    border: 1px solid rgba(255,255,255,0.7);
    padding: 15px 22px;
}

.hero-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -42%);
    text-align: center;
    width: 90%;
}

.kicker {
    font-size: 14px;
    letter-spacing: 8px;
    margin-bottom: 38px;
}

.title {
    font-family: Georgia, serif;
    font-size: clamp(55px, 7vw, 105px);
    font-weight: normal;
    letter-spacing: 8px;
    line-height: 1;
}

.line {
    width: 45px;
    height: 1px;
    background: white;
    margin: 28px auto;
    opacity: 0.8;
}

.tagline {
    font-size: 17px;
    letter-spacing: 7px;
    margin-bottom: 34px;
}

.button {
    display: inline-block;
    color: white;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.8);
    padding: 18px 28px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.location {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 12px;
    letter-spacing: 5px;
}

@media (max-width: 900px) {

    .hero {
        min-height: 100svh;
        height: 100svh;
        background-position: 58% center;
    }

    nav {
        padding: 24px 18px;
    }

    .logo {
        font-size: 20px;
        letter-spacing: 3px;
    }

    .menu {
        gap: 8px;
    }

    .menu a:not(.radio) {
        display: none;
    }

    .radio {
    padding: 9px 13px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #ffffff;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.85);
    text-decoration: none;
}

.radio,
.radio:visited,
.radio:hover,
.radio:active,
.radio:focus {
    color: #ffffff !important;
    background: transparent !important;
    text-decoration: none !important;
}

.radio-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #ff0000;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
}

    .hero-content {
        top: 52%;
        width: 88%;
        transform: translate(-50%, -50%);
    }

    .kicker {
        font-size: 9px;
        letter-spacing: 4px;
        margin-bottom: 28px;
        white-space: nowrap;
    }

    .title {
        font-size: 43px;
        letter-spacing: 3px;
        line-height: 1.05;
    }

    .line {
        width: 40px;
        margin: 24px auto;
    }

    .tagline {
        font-size: 11px;
        letter-spacing: 3px;
        margin-bottom: 28px;
        white-space: nowrap;
    }

    .button {
        padding: 16px 22px;
        font-size: 10px;
        letter-spacing: 2.5px;
    }

    .location {
        bottom: 24px;
        font-size: 10px;
        letter-spacing: 4px;
    }

    .arrow {
        margin-top: 10px;
        font-size: 18px;
    }

    .hero {
        background-position: 55% center;
    }
}

</style>
</head>

<body>

<section class="hero">

    <nav>

        <div class="logo">
            MERIDIANO 72
        </div>

        <div class="menu">

            <a href="#">Our Story</a>
            <a href="#">Our Coffees</a>
            <a href="#">Origins</a>
            <a href="#">Journal</a>
            <a href="#">Contact</a>
            <a href="#">EN⌄</a>

            <button class="radio" onclick="openRadio()">
    <span class="radio-dot"></span> RADIO / 72W
</button>

        </div>

    </nav>


    <div class="hero-content">

        <div class="kicker">
            COLOMBIAN SPECIALTY COFFEE
        </div>

        <h1 class="title">
            MERIDIANO 72
        </h1>

        <div class="line"></div>

        <div class="tagline">
            CON LOS PIES EN LA TIERRA.
        </div>

        <div class="line"></div>

        <a href="#" class="button">
            Explore our coffees &nbsp; →
        </a>

    </div>


    <div class="location">

        COLOMBIA

        <span class="arrow">⌄</span>

    </div>

</section>
    <script>
function openRadio() {
    alert("🔴 RADIO / 72W — Coming soon.");
}
</script>

</body>
</html>
